spring:
  application:
    name: bookconnect-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookconnect}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 0
        order_inserts: false
        order_updates: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

application:
  jwt:
    secret: ${JWT_SECRET:yourSecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmToWorkProperly}
    expiration: 86400000 # 24 hours in milliseconds
  
  upload:
    directory: ${UPLOAD_DIR:uploads}
    base-url: ${BASE_URL:http://localhost:8080}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.bookconnect: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
